name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Check prose formatting
        run: pnpm format:prose

      - name: Check license headers
        run: pnpm license:check

      - name: Run export parity check
        run: pnpm exports:check

      - name: Run type checks
        run: pnpm types:check

      - name: Build packages
        run: pnpm build

      - name: Build docs site
        run: pnpm --filter fumandocs-www build
