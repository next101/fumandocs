name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Check prose formatting
        run: pnpm format:prose

      - name: Check license headers
        run: pnpm license:check

      - name: Run export parity check
        run: pnpm exports:check

      - name: Check template dependency versions
        run: pnpm template:versions:check

      - name: Run type checks
        run: pnpm types:check

      - name: Build packages
        run: pnpm build

      - name: Build docs site
        run: pnpm --filter fumandocs-www build

      - name: Scaffold a docs app from the template
        run: node packages/create-fumandocs/dist/bin.js smoke-app --no-git

      - name: Verify project name replacement
        run: grep -q '"smoke-app"' smoke-app/components/logo.tsx

      - name: Install scaffolded app dependencies
        working-directory: smoke-app
        run: pnpm install

      - name: Build scaffolded app
        working-directory: smoke-app
        run: pnpm build
