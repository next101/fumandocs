commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
pre-commit:
  commands:
    biome:
      glob: '*.{js,ts,tsx,mjs,cjs,json,css}'
      run: pnpm exec biome check --write --unsafe {staged_files}
      stage_fixed: true
    license:
      run: pnpm license:check
    prettier:
      glob: '*.{md,mdx}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
pre-push:
  commands:
    types:
      run: pnpm types:check
